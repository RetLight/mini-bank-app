spring.application.name=customer-service

# Tests: H2 en memoria con las MISMAS migraciones que MySQL, más los datos de prueba (db/seed).
# Este archivo sustituye al application.properties principal: no se lee .env ni se necesita MySQL.
spring.datasource.url=jdbc:h2:mem:customer_db;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.jwt.secret=test-secret-for-jwt-tests-must-be-at-least-32-bytes-long

# Los tests no dependen del Config Server.
spring.cloud.config.enabled=false
spring.config.import=

# auth-service: cada test de verificación apunta a su servidor falso; por defecto, a un puerto donde no escucha nadie.
minibank.services.auth-url=http://localhost:1
# Los mismos parámetros que config-repo, con tiempos cortos para que los tests no esperen.
spring.cloud.openfeign.client.config.default.connect-timeout=500
spring.cloud.openfeign.client.config.default.read-timeout=500
resilience4j.retry.instances.authService.max-attempts=2
resilience4j.retry.instances.authService.wait-duration=50ms
resilience4j.retry.instances.authService.retry-exceptions=com.project.minibank.customer.infrastructure.adapter.out.auth.AuthUnavailableException
resilience4j.retry.instances.authService.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException,com.project.minibank.customer.infrastructure.adapter.out.auth.AuthRejectedException
resilience4j.circuitbreaker.instances.authService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.authService.sliding-window-size=10
resilience4j.circuitbreaker.instances.authService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.authService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.authService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.authService.record-exceptions=com.project.minibank.customer.infrastructure.adapter.out.auth.AuthUnavailableException
