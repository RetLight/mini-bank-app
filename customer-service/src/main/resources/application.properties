spring.application.name=customer-service
# La configuración vive en config-repo y la sirve config-server. Con "optional:" el servicio arranca aunque el
# Config Server no responda, con los valores de respaldo de abajo. .env (ignorado por git) da los secretos en local.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888},optional:file:.env[.properties],optional:file:../.env[.properties]

# Secretos y credenciales: nunca en config-repo, siempre desde el entorno.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# Secreto del JWT: customer-service valida los tokens con él; es el mismo con el que firma auth-service.
app.jwt.secret=${JWT_SECRET}

# Respaldo, solo si el Config Server no responde. Los valores que sirve el Config Server ganan sobre estos.
minibank.config-origin=local
server.port=8082
# DB_PORT (de .env) es el puerto publicado por docker-compose.yml; por defecto 3307.
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3307}/customer_db
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
minibank.services.auth-url=http://localhost:8081
