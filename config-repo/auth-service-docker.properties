# auth-service, perfil docker (docker compose --profile app): dentro de la red de Compose cada contenedor se
# llama por su nombre de servicio, no por localhost, y MySQL escucha en su puerto interno 3306 (no en DB_PORT).
spring.datasource.url=jdbc:mysql://mysql:3306/auth_db
minibank.services.customer-url=http://customer-service:8082
