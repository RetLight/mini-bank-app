# auth-service: común a todos los perfiles. Sin secretos (ver README).
server.port=8081
# DB_PORT (de .env) es el puerto publicado por docker-compose.yml; por defecto 3307.
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3307}/auth_db
# Solo el esquema; el perfil dev añade los datos de prueba.
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false
# Vida del token de usuario. El secreto (JWT_SECRET) no va aquí: llega del entorno.
app.jwt.expiration-minutes=30

# Registro: auth-service crea el cliente en customer-service (Feign, directo, sin pasar por el gateway).
minibank.services.customer-url=http://localhost:8082
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=3000
