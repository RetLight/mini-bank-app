# customer-service: común a todos los perfiles. Sin secretos (ver README).
server.port=8082
# DB_PORT (de .env) es el puerto publicado por docker-compose.yml; por defecto 3307.
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3307}/customer_db
# Solo el esquema; el perfil dev añade los datos de prueba.
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false

# auth-service, llamado directo (sin pasar por el gateway).
minibank.services.auth-url=http://localhost:8081

# Llamada a auth-service al crear un favorito (OpenFeign). Fallar rápido: un auth lento no debe retener hilos.
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=2000

# Resiliencia sobre esa llamada (instancia "authService"). Orden: Retry( CircuitBreaker( llamada ) ).
# Peor caso mientras auth está colgado: 2 intentos x 2 s de lectura + 300 ms de espera = unos 4,3 s.
resilience4j.retry.instances.authService.max-attempts=2
resilience4j.retry.instances.authService.wait-duration=300ms
resilience4j.retry.instances.authService.retry-exceptions=com.project.minibank.customer.infrastructure.adapter.out.auth.AuthUnavailableException
# un circuito abierto o un 4xx no se reintentan
resilience4j.retry.instances.authService.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException,com.project.minibank.customer.infrastructure.adapter.out.auth.AuthRejectedException

resilience4j.circuitbreaker.instances.authService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.authService.sliding-window-size=10
resilience4j.circuitbreaker.instances.authService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.authService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.authService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.authService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.authService.automatic-transition-from-open-to-half-open-enabled=true
# solo los fallos reales cuentan; un 404 (usuario inexistente) o un 4xx son respuestas de un servicio sano
resilience4j.circuitbreaker.instances.authService.record-exceptions=com.project.minibank.customer.infrastructure.adapter.out.auth.AuthUnavailableException
