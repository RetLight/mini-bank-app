# account-service: común a todos los perfiles. Sin secretos (ver README).
server.port=8083
# DB_PORT (de .env) es el puerto publicado por docker-compose.yml; por defecto 3307.
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3307}/account_db
# Solo el esquema; el perfil dev añade los datos de prueba.
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false
