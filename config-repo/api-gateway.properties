# api-gateway: común a todos los perfiles. El cliente solo habla con este puerto.
server.port=8080

# A qué dirección va cada servicio. Las llamadas entre servicios (Feign) no pasan por el gateway.
minibank.services.auth-url=http://localhost:8081
minibank.services.customer-url=http://localhost:8082
minibank.services.account-url=http://localhost:8083

# Rutas: gana el primer predicado que coincide. Los paths NO se reescriben: los servicios exponen los mismos.
# /internal/** no tiene ruta a propósito: solo lo usan los servicios entre ellos, nunca un cliente.
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${minibank.services.auth-url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[1].id=customer-service
spring.cloud.gateway.server.webflux.routes[1].uri=${minibank.services.customer-url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/favorites/**,/admin/customers/**
spring.cloud.gateway.server.webflux.routes[2].id=account-service
spring.cloud.gateway.server.webflux.routes[2].uri=${minibank.services.account-url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/transfers/**,/movements/**

# Timeouts hacia los servicios: mejor fallar rápido que dejar colgado al cliente.
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# CORS solo aquí (nunca también en los servicios, o el navegador recibe cabeceras duplicadas).
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,X-Request-Id
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=X-Request-Id

# Rutas que no necesitan Authorization en el gateway (login y registro). El resto sin Bearer: 401 antes de enrutar.
minibank.gateway.public-paths=/auth/**
