spring.application.name=config-server
server.port=8888

# Backend "native": lee archivos de una carpeta. En producción se usaría Git (spring.cloud.config.server.git.uri).
# "include" y no "active": si alguien arranca el servidor con SPRING_PROFILES_ACTIVE=dev (por ejemplo, exportado para
# los servicios), "active" quitaría native y el servidor intentaría usar Git y no arrancaría.
spring.profiles.include=native
# Relativo a la carpeta desde la que arranca el servidor (config-server/). CONFIG_REPO_PATH lo cambia.
spring.cloud.config.server.native.search-locations=file:${CONFIG_REPO_PATH:../config-repo}
