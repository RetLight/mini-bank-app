spring.application.name=api-gateway

# Rutas, CORS y timeouts viven en config-repo (api-gateway*.properties). Un gateway sin rutas no sirve de nada,
# así que, a diferencia de los servicios, no tiene respaldo local para ellas: arranca primero config-server.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

server.port=8080
